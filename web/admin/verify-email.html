<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="referrer" content="no-referrer" />

  <title>Verifying your email — StockLink</title>

  <link rel="stylesheet" href="/admin/verify-email.css" />

  <script src="/admin/config.js" defer></script>
  <script src="/admin/verify-email.js" defer></script>
</head>

<!-- data-state is switched by verify-email.js: verifying | verified | failed -->

<body data-state="verifying">
  <main class="verification-container">
    <section class="verification-card" aria-busy="true">

      <!-- Status icon: only the one matching data-state is shown -->
      <div class="verification-icon" aria-hidden="true">

        <!-- verifying: spinner -->
        <svg class="state-icon icon-verifying" viewBox="0 0 32 32" width="34" height="34" fill="none"
          stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
          <circle class="spinner-track" cx="16" cy="16" r="11" />
          <circle class="spinner-arc" cx="16" cy="16" r="11" pathLength="100" />
        </svg>

        <!-- verified: check -->
        <svg class="state-icon icon-verified" viewBox="0 0 32 32" width="34" height="34" fill="none"
          stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path class="draw" pathLength="1" d="M8 16.5l5.5 5.5L24 10.5" />
        </svg>

        <!-- failed: cross -->
        <svg class="state-icon icon-failed" viewBox="0 0 32 32" width="34" height="34" fill="none" stroke="currentColor"
          stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path class="draw" pathLength="1" d="M10.5 10.5l11 11" />
          <path class="draw draw-2" pathLength="1" d="M21.5 10.5l-11 11" />
        </svg>
      </div>

      <div class="verification-content" role="status" aria-live="polite">

        <span class="verification-eyebrow" id="verification-eyebrow">
          StockLink
        </span>

        <h1 id="verification-status">
          Verifying your email...
        </h1>

        <p id="verification-message">
          Please wait while we verify your email address.
        </p>

        <div class="verification-actions">
          <a id="verification-login-link" class="verification-login-button" href="/admin/login.html" hidden>
            Go to login
          </a>

          <button type="button" id="verification-retry" class="verification-retry-button" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
            Try again
          </button>
        </div>

      </div>

    </section>
  </main>
</body>

</html>
